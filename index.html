<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockle</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Blockle" />
    <meta
      name="description"
      content="Blockle is a unique blend of a word and puzzle game with a new challenge every day."
    />
    <meta
      name="keywords"
      content="puzzle game, word game, tetris, blocks, vocabulary, brain game, word search, word grid, word puzzle"
    />
    <meta name="author" content="Ollie Woodman" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blockle.au/" />
    <meta property="og:title" content="Blockle" />
    <meta
      property="og:description"
      content="Blockle is a unique blend of a word and puzzle game with a new challenge every day."
    />
    <meta property="og:image" content="/og-app.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:site_name" content="Blockle" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://blockle.au/" />
    <meta property="twitter:title" content="Blockle" />
    <meta
      property="twitter:description"
      content="Blockle is a unique blend of a word and puzzle game with a new challenge every day."
    />
    <meta property="twitter:image" content="/og-app.png" />

    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="theme-color" content="#7f22fe" />

    <script>
      // Check for dark mode preference and apply it
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101828');
      } else {
        document.documentElement.classList.remove("dark");
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#d1d5dc');
      }
    </script>
    <script
      defer
      src="https://stats.server.olliewoodman.com/script.js"
      data-website-id="1e97cc0d-a8d0-4fc2-b9d8-9f046675b74b"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
